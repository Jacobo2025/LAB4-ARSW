version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: lab_postgres
    environment:
      POSTGRES_DB: BlueprintDB
      POSTGRES_USER: jacobo
      POSTGRES_PASSWORD: jacobo123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: